<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#11101d" />
    <meta
      name="description"
      content="Choose from your unlocked GT platforming levels."
    />
    <title>Choose a Level — GT</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/gt-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="style.css?v=8" />
  </head>
  <body>
    <main class="app level-select-page">
      <header class="topbar">
        <a class="brand" href="index.html" aria-label="GT home">
          <span class="brand-mark" aria-hidden="true">G</span>
          <span>GT</span>
        </a>
        <a class="back-link" id="backToGame" href="index.html">← Back to game</a>
        <button class="install-app-button" id="installAppButton" type="button" hidden>INSTALL APP</button>
      </header>

      <section class="selector-intro">
        <div>
          <p class="eyebrow">Choose your next challenge</p>
          <h1>Pick your <span>poison.</span></h1>
          <p class="intro-copy">Select any unlocked level. Your progress is saved on this device.</p>
        </div>
        <div class="selector-progress">
          <span class="toolbar-label">LEVELS UNLOCKED</span>
          <strong id="unlockedCount">1 <span>/ 100</span></strong>
          <div class="mini-progress"><div id="unlockedProgress"></div></div>
        </div>
      </section>

      <div class="chapter-list" id="chapterList" aria-label="Level selection by chapter"></div>

      <footer class="page-footer">MADE FOR THE BRAVE <span>·</span> NOT RESPONSIBLE FOR RAGE QUITS</footer>
    </main>
    <script src="level-select.js?v=3"></script>
    <script src="pwa.js?v=1"></script>
  </body>
</html>
